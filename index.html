<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Cami, amor de mi vida 💙</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Georgia, serif;
    overflow-x:hidden;
    background:linear-gradient(135deg,#1f1c4d,#4b2a7b,#6a4cff);
    background-size:400% 400%;
    animation:fondo 12s ease infinite;
}

/* FONDO */

@keyframes fondo{

    0%{
        background-position:0% 50%;
    }

    50%{
        background-position:100% 50%;
    }

    100%{
        background-position:0% 50%;
    }

}

/* PANTALLA DE CLAVE */

#pantalla-clave{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    position:relative;
    overflow:hidden;
}

/* CORAZONES GRANDES */

.corazon{
    position:absolute;
    color:rgba(255,255,255,0.18);
    animation:flotar linear infinite;
    user-select:none;
}

@keyframes flotar{

    0%{
        transform:translateY(100vh) scale(1);
        opacity:0;
    }

    30%{
        opacity:1;
    }

    100%{
        transform:translateY(-120vh) scale(1.4);
        opacity:0;
    }

}

.caja{
    width:340px;
    background:rgba(255,255,255,0.12);
    backdrop-filter:blur(12px);
    padding:40px 30px;
    border-radius:30px;
    text-align:center;
    box-shadow:0 0 30px rgba(0,0,0,0.25);

    opacity:0;
    transform:translateY(40px);

    animation:entrada 2s forwards;
}

@keyframes entrada{

    to{
        opacity:1;
        transform:translateY(0);
    }

}

.titulo{
    color:white;
    font-size:36px;
    margin-bottom:15px;
    text-shadow:0 0 15px rgba(255,255,255,0.5);
}

.subtexto{
    color:#efe8ff;
    line-height:1.7;
    margin-bottom:22px;
    font-size:16px;
}

/* INPUT CELULAR */

input{
    width:100%;
    padding:15px;
    border:none;
    border-radius:15px;
    outline:none;
    background:rgba(255,255,255,0.2);
    color:white;
    text-align:center;

    letter-spacing:10px;
    font-size:30px;
    font-family:monospace;

    margin-bottom:15px;
}

input::placeholder{
    color:#ece6ff;
}

button{
    width:100%;
    padding:15px;
    border:none;
    border-radius:15px;
    background:#7a5cff;
    color:white;
    font-size:18px;
    cursor:pointer;
    transition:0.4s;
}

button:hover{
    transform:scale(1.05);
    background:#9378ff;
}

#error{
    color:#ffd3d3;
    margin-top:12px;
    display:none;
}

/* CARTA */

#carta{
    display:none;
    padding:50px 15px;
    position:relative;
}

/* CORAZONES FONDO */

.corazon2{
    position:fixed;
    color:rgba(255,255,255,0.12);
    font-size:35px;
    animation:flotar2 linear infinite;
}

@keyframes flotar2{

    from{
        transform:translateY(100vh);
    }

    to{
        transform:translateY(-120vh);
    }

}

.contenido{

    background:rgba(255,255,255,0.12);
    backdrop-filter:blur(15px);

    max-width:950px;
    margin:auto;

    padding:55px 45px;

    border-radius:35px;

    box-shadow:0 0 40px rgba(0,0,0,0.25);

    opacity:0;
    filter:blur(10px);

    animation:desvanecer 2.5s forwards;
}

@keyframes desvanecer{

    from{
        opacity:0;
        filter:blur(10px);
        transform:translateY(30px);
    }

    to{
        opacity:1;
        filter:blur(0);
        transform:translateY(0);
    }

}

.titulo-carta{
    text-align:center;
    color:white;
    font-size:45px;
    margin-bottom:10px;

    animation:brillo 2s infinite alternate;
}

@keyframes brillo{

    from{
        text-shadow:0 0 8px #b7a3ff;
    }

    to{
        text-shadow:0 0 25px #ffffff;
    }

}

.subtitulo{
    text-align:center;
    color:#ece6ff;
    font-size:22px;
    margin-bottom:45px;
    line-height:1.7;
}
